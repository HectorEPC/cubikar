<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Cinta 1: Amarillo a Ámbar -->
    <linearGradient id="ribbonAmber" x1="20" y1="20" x2="80" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <!-- Gradiente Cinta 2: Azul Eléctrico a Indigo -->
    <linearGradient id="ribbonBlue" x1="15" y1="35" x2="50" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <!-- Gradiente Cinta 3: Esmeralda a Teal -->
    <linearGradient id="ribbonEmerald" x1="50" y1="85" x2="85" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Cinta isométrica formando la "C" abierta (Estilo Tech Moderno) -->
  <!-- Tramo Superior (Ámbar) -->
  <path d="M78 30L52 15C49.5 13.5 46.5 13.5 44 15L22 28C19 29.8 19 33 22 35L48 50C50.5 51.5 53.5 51.5 56 50L78 37C81 35.2 81 32 78 30Z" 
        fill="url(#ribbonAmber)" />

  <!-- Tramo Izquierdo y Frontal Descendente (Azul Eléctrico) -->
  <path d="M20 33V65C20 68 22 70 25 72L48 85C50 86 52 86 54 85L54 52C54 50 52 48.5 50 47.5L25 33C22 31.5 20 32 20 33Z" 
        fill="url(#ribbonBlue)" opacity="0.95" />

  <!-- Tramo Base Retorno (Esmeralda/Cyan) -->
  <path d="M52 86L75 73C78 71.5 80 68.5 80 65V52L54 67V85C54 85.7 53 86.3 52 86Z" 
        fill="url(#ribbonEmerald)" />

  <!-- Punto de acento flotante -->
  <circle cx="78" cy="45" r="4.5" fill="#F43F5E" />
</svg>
