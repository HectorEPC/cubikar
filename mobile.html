  <script>
    try {
      var _sp = window.location.search || '';
      if (/[?&]desktop=1\b/.test(_sp)) {
        window.location.replace('index.html' + _sp + (window.location.hash || ''));
      } else if (/[?&]mobile=1\b/.test(_sp)) {
        localStorage.removeItem('cubikar_force_desktop');
      }
      var _t = localStorage.getItem('adm_const_theme_mode');
      var _n = _t ? _t === 'night' : true;
      document.documentElement.setAttribute('data-theme', _n ? 'night' : 'day');
      if (_n) document.documentElement.classList.add('dark-mode');
    } catch (e) {}
  </script>
